# Exemple simplifié et générique
# Pipeline : tests en barrière, image Docker étiquetée par commit, un déploiement à la fois.
# Les noms de ressources et les secrets sont des espaces réservés.

name: Construire et déployer

on:
  push:
    branches: [main]

concurrency:
  group: deploiement
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mon-api

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/MonApi.Tests.csproj --configuration Release

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./src/MonApi
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.NOM_APPLICATION }}
          publish-profile: ${{ secrets.PROFIL_PUBLICATION }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
